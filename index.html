<!DOCTYPE HTML>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Sudoku Candidate Board</title>
        <link rel="stylesheet" href="style.css">

    </head>
    <body>
    <main>
        <h1>Sudoku Candidate Board</h1>
        <p class="description">
            Enter numbers and watch the impossible candidates disappear.
        </p>
        <div id="board"></div>
        <div class="controls">
            <button id="reset">Reset Board</button>
            <button id="clear" class="secondary">Clear selected cell</button>
        </div>

        <p id="status">
            Select a cell and enter a number from 1 to 9.
        </p>

        <div class="help">
            <strong>How to Use:</strong>
            Click a cell and type a number
            Red cells indicate a duplicate number.
        </div>
    </main>
    <script src="code.js"></script>
    </body>
</html>
